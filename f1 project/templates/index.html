<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Plotter</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ── Sticky top control bar ─────────────────────────────────── -->
<div id="topBar">
    <div class="site-title">F1 <span>Plotter</span></div>

    <form id="controlForm" method="POST">
        {{ form.hidden_tag() }}

        <div class="field-group">
            <label for="graphType">Graph Type</label>
            {{ form.graphType }}
        </div>

        <div class="field-group">
            <label for="season">Season</label>
            {{ form.season }}
        </div>

        <div class="field-group" id="racesGroup">
            <label for="races" id="racesLabel">Race</label>
            {{ form.races }}
        </div>

        <div class="field-group" id="sprintScoringDiv" style="display:none;">
            <label for="sprintScoring">Sprint Scoring</label>
            {{ form.sprintScoring }}
        </div>

        {{ form.submit(id="submitButton", disabled="disabled") }}
    </form>
</div>

<!-- ── Main content ────────────────────────────────────────────── -->
<div id="mainContent">
    <p id="loadingMsg">Generating chart — this may take a moment…</p>

    <div id="chartWrapper">
        <div class="chart-header">
            <h2>Generated Plot</h2>
        </div>
        <div id="plotDiv"></div>
    </div>
</div>

<script>
    const graphTypeSelect     = document.querySelector('select[name="graphType"]');
    const seasonSelect        = document.querySelector('select[name="season"]');
    const raceSelect          = document.querySelector('select[name="races"]');
    const sprintScoringSelect = document.querySelector('select[name="sprintScoring"]');
    const submitButton        = document.getElementById('submitButton');
    const racesLabel          = document.getElementById('racesLabel');
    const sprintScoringDiv    = document.getElementById('sprintScoringDiv');
    const loadingMsg          = document.getElementById('loadingMsg');
    const chartWrapper        = document.getElementById('chartWrapper');

    // ── Fetch Plotly JSON and render chart ─────────────────────
    {% if plot_data_url %}
    (async () => {
        loadingMsg.classList.add('visible');
        chartWrapper.classList.remove('visible');

        try {
            const resp = await fetch("{{ plot_data_url | safe }}");
            if (!resp.ok) throw new Error(`Server error: ${resp.status}`);
            const plotlyJson = await resp.json();

            plotlyJson.layout.width    = undefined;
            plotlyJson.layout.autosize = true;

            Plotly.react('plotDiv', plotlyJson.data, plotlyJson.layout, {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToRemove: ['lasso2d', 'select2d'],
            });

            window.dispatchEvent(new Event('resize'));
            chartWrapper.classList.add('visible');
        } catch (err) {
            chartWrapper.innerHTML =
                `<div class="chart-header"><h2>Error</h2></div>` +
                `<p class="chart-error">${err.message}</p>`;
            chartWrapper.classList.add('visible');
        } finally {
            loadingMsg.classList.remove('visible');
        }

        resetForm();
    })();
    {% endif %}

    // ── Form helpers ────────────────────────────────────────────
    function resetForm() {
        graphTypeSelect.value     = '';
        seasonSelect.value        = '';
        raceSelect.innerHTML      = '<option value="">--Race--</option>';
        sprintScoringSelect.value = '';
        racesLabel.textContent    = 'Race';
        sprintScoringDiv.style.display = 'none';
        checkAllSelected();
    }

    function checkAllSelected() {
        const graphType = graphTypeSelect.value;
        let required = [graphTypeSelect, seasonSelect, raceSelect];
        if (graphType === 'championshipProgressionGraph') {
            required.push(sprintScoringSelect);
        }
        submitButton.disabled = !required.every(s => s.value);
    }

    function updateRaceOptions() {
        const graphType   = graphTypeSelect.value;
        const seasonValue = seasonSelect.value;

        sprintScoringDiv.style.display =
            graphType === 'championshipProgressionGraph' ? 'flex' : 'none';
        if (graphType !== 'championshipProgressionGraph') {
            sprintScoringSelect.value = '';
        }

        if (!seasonValue) {
            const def = graphType === 'qualifyingAverages' || graphType === 'singleQualifyingAverages'
                ? '--Driver Pairings--'
                : graphType === 'championshipProgressionGraph'
                    ? '--Scoring Systems--'
                    : '--Race--';
            racesLabel.textContent = def.replace(/--/g, '').trim();
            raceSelect.innerHTML   = `<option value="">${def}</option>`;
            checkAllSelected();
            return;
        }

        let endpoint = '/get_races';
        let label    = 'Race';
        if (graphType === 'qualifyingAverages' || graphType === 'singleQualifyingAverages') {
            endpoint = '/get_pairings';
            label    = 'Driver Pairings';
        } else if (graphType === 'championshipProgressionGraph') {
            endpoint = '/get_systems';
            label    = 'Scoring System';
        }
        racesLabel.textContent = label;

        fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ season: seasonValue })
        })
        .then(r => r.json())
        .then(data => {
            raceSelect.innerHTML = '';
            data.forEach(opt => {
                const o = document.createElement('option');
                o.value = opt[0];
                o.textContent = opt[1];
                raceSelect.append(o);
            });
            raceSelect.value = '';
            checkAllSelected();
        });
    }

    checkAllSelected();

    [graphTypeSelect, seasonSelect, raceSelect, sprintScoringSelect].forEach(s => {
        s.addEventListener('change', checkAllSelected);
    });
    graphTypeSelect.addEventListener('change', updateRaceOptions);
    seasonSelect.addEventListener('change', updateRaceOptions);
</script>
</body>
</html>
